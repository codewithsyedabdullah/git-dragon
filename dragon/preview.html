<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-dragon preview</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1, h2 { margin: 0; font-size: 14px; font-weight: 600; }
  header, section { display: grid; gap: 12px; padding: 16px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #f0f6fc; }
  .images { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; }
  img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
</style>
</head>
<body>
<header class="dark"><h1>@codewithsyedabdullah - Stage 5: Legendary Dragon (11947 contributions)</h1></header>
<section class="dark">
<h2>GitHub dark mode</h2>
<div class="images">
<figure><img src="dragon.gif" width="640" height="300" alt="Animated dragon"><figcaption>dragon.gif (animated)</figcaption></figure>
<figure><img src="dragon.png" width="640" height="300" alt="Dragon still"><figcaption>dragon.png (still)</figcaption></figure>
</div>
</section>
<section class="light">
<h2>GitHub light mode</h2>
<div class="images">
<figure><img src="dragon.gif" width="640" height="300" alt="Animated dragon"><figcaption>dragon.gif (animated)</figcaption></figure>
<figure><img src="dragon.png" width="640" height="300" alt="Dragon still"><figcaption>dragon.png (still)</figcaption></figure>
</div>
</section>
</body>
</html>
