name: Update Profile Dragon

on:
  schedule:
    # Runs every night at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-dragon:
    runs-on: ubuntu-latest
    steps:
      - uses: codewithsyedabdullah/git-dragon@v1
        with:
          window: annual
          commit: "true"
          branch: output