name: Update Profile Dragon

on:
  schedule:
    # Runs every night at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dragon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Local action (this repository). In a profile repo use:
      #   uses: codewithsyedabdullah/git-dragon@v1   (after publishing a v1 tag)
      - uses: ./
        with:
          window: annual
          branch: output
